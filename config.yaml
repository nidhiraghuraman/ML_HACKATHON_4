# PathSnap configuration. Paths are relative to the project folder (ML_Hackathon).
seed: 42

data:
  raw_dir: data/raw            # contains train/ and student_test/ (and later evaluator_test/)
  partitions: [train, student_test]

exploration:
  output_dir: results/exploration
  # Trips to draw as interactive Folium maps (any IDs that exist in the partitions above)
  folium_trips: ["00000001", "00000046", "00000000", "00000091"]
  folium_max_gps_points: 3000      # GPS markers drawn per map (evenly subsampled beyond this)
  folium_max_network_arcs: 20000   # road segments drawn per map (nearest to the trajectory first)
  network_buffer_m: 300            # draw road segments within this distance of the trajectory box
  large_gap_s: 10                  # a time step longer than this is counted as a "gap"
  implausible_speed_mps: 70        # ~250 km/h; faster jumps between points are flagged as GPS noise

# ----------------------------------------------------------------------------- PHASE 2
phase2:
  partitions: [train, student_test]   # processed separately, saved to separate files
  processed_dir: data/processed       # candidate datasets (Parquet)
  output_dir: results/phase2          # reports, plots, maps
  projection: utm_per_trip            # each trip uses the UTM zone of its median GPS point

  preprocessing:
    sort_by_time: true
    gap_s: 10                 # dt above this = "gap"
    long_gap_s: 60            # dt above this starts a new segment_id
    stationary_window_s: 30   # minimum duration of a stay (stay-point detection)
    stationary_max_disp_m: 15 # all points of a stay lie within this radius of its first point
    bearing_half_window_s: 3  # heading from the points 3 s before and 3 s after
    bearing_min_disp_m: 5     # heading only trusted if the vehicle moved at least this far
    spike_speed_mps: 70       # in AND out faster than this -> GPS spike

  candidates:
    radii_m: [50, 100, 200]   # search radius steps (expanded only when too few arcs found)
    min_candidates: 2         # expand if fewer than this many arcs within the radius
    max_candidates: 24        # keep the K nearest arcs (chosen from the Phase 2 coverage study)

  labels:
    sigma_m: 10               # GPS noise scale in the alignment cost
    cap_m: 50                 # alignment cost stops growing beyond this distance
    w_heading: 3.0            # cost of driving opposite to the route arc
    eta_per_m: 0.001          # tiny cost per metre of route advanced (tie-breaker)
    unalign_dist_m: 40        # aligned arc farther than this -> unalignable
    stationary_unalign_dist_m: 20
    ambiguity_margin_m: 2     # another route arc within 2 m of the aligned one -> ambiguous
    ambiguity_window: 2       # look this many route positions before/after
    row_chunk: 1024

  diagnostics:
    coverage_radii_m: [10, 15, 20, 25, 30, 40, 50, 75, 100, 150, 200]
    coverage_k: [1, 2, 4, 6, 8, 12, 16, 20, 24, 32]
    map_trips: ["00000033", "00000054", "00000069", "00000090", "00000046", "00000091"]
    map_max_obs_with_candidates: 400   # GPS points whose candidate lines are drawn per map

# ----------------------------------------------------------------------------- PHASE 3
phase3:
  output_dir: results/phase3
  artifacts_dir: artifacts/phase3        # saved models
  train_labels: [0, 1]                   # rows used for fitting (1 positive, 0 negative)
  cv_folds: 5                            # 80 trips -> ~16 validation trips per fold
  threshold: 0.5                         # for accuracy / precision / recall / F1 (NOT tuned in Phase 3)
  knn_train_rows: 60000                  # KNN only: rows sampled (whole GPS points) from each fold's training trips
  permutation_obs_per_fold: 15000        # GPS points per validation fold used for permutation importance
  train_eval_obs: 20000                  # training GPS points sampled per fold to measure training Top-1 (overfitting check)
  evaluate_student_test: true            # score all models on student_test AFTER selection is saved (never used to choose)
  selection:
    primary: top1                        # mean CV Top-1 on aligned GPS points
    tie_margin: 0.005                    # models within 0.5 percentage points of the best are "tied"
    tie_breakers: [mrr, predict_s_per_1k_obs]
  baseline_formula:                      # fixed a priori, not tuned
    sigma_m: 10
    w_heading: 3.0
  models:
    logistic_regression: {C: 1.0, max_iter: 1000}
    knn: {n_neighbors: 50, weights: uniform}
    decision_tree: {max_depth: 12, min_samples_leaf: 50}
    random_forest: {n_estimators: 100, max_depth: 14, min_samples_leaf: 50, max_samples: 0.3}
    hist_gradient_boosting: {max_iter: 300, learning_rate: 0.1, max_leaf_nodes: 31}
